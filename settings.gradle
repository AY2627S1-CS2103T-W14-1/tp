/**
 * Uses Maven Central's CDN endpoint directly for plugin resolution.
 *
 * This avoids depending on a redirect from the Gradle Plugin Portal to
 * repo.maven.apache.org, which can be unavailable on an individual CI runner.
 */
pluginManagement {
    repositories {
        maven {
            url = uri("https://repo1.maven.org/maven2")
        }
        gradlePluginPortal()
    }
}
